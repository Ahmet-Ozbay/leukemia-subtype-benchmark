name: leukemia-subtype-benchmark
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- Core Numerical & Tabular Data ---
      - numpy>=1.26.0,<2.0.0
      - pandas>=2.2.0,<2.3.0
      - scipy>=1.12.0,<1.14.0
      - pyarrow>=14.0.0,<16.0.0

      # --- Machine Learning, Metrics & Optimization ---
      - scikit-learn>=1.4.0,<1.6.0
      - imbalanced-learn>=0.12.0
      - optuna>=3.6.0,<4.0.0

      # --- Interpretability & Explainability ---
      - shap>=0.45.0
      - joblib>=1.3.2

      # --- Dimensionality Reduction & Visualization (F6) ---
      - matplotlib>=3.8.0
      - seaborn>=0.13.0
      - umap-learn>=0.5.5

      # --- Bioinformatics & GEO Data Retrieval (A3) ---
      - GEOparse>=2.0.4
      - requests>=2.31.0

      # --- Deep Learning Baseline (Bonus B1) ---
      - torch>=2.2.0
      - torchvision>=0.17.0

      # --- Utilities & Workflow ---
      - tqdm>=4.66.0
      - pyyaml>=6.0.1

      ## Testing & Validation
      - pytest>=8.0.0

      ## Data Acquisition & Kaggle API
      - kagglehub>=0.3.0